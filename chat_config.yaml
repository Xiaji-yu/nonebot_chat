# ============================================================
#  nonebot_chat 配置文件
# ============================================================
#  修改后重启 bot 生效。完整字段说明与取值范围见
#  README.md「配置详解」章节；此处仅保留一行速览注释。
#  配置文件缺失/解析错误时回退内置默认值（仅开发调试用）。
# ============================================================

# ------------------------------------------------------------------
#  全局开关（NoneBot 环境变量，在 bot 项目的 .env 中设置）
#    CHAT_ONLY_SUPERUSERS=true/false   是否仅超级用户可用
#    CHAT_CHAT_ENABLED=true/false      是否启用聊天功能
#    CHAT_CONFIG_PATH=...              chat_config.yaml 路径
# ------------------------------------------------------------------


# ------------------------------------------------------------------
#  人格（Personality）
#  system_prompt 是最重要的配置项，决定 AI 的人设、语气与风格。
# ------------------------------------------------------------------
personality:
  name: "小助手"
  system_prompt: |
    你是一个友善、聪明的助手，名叫小助手。
    请用简洁、自然的语气回复，避免过于正式或机械的表达。
    适当使用 emoji，但不要过度。记住和用户的历史对话上下文。
  wake_words:
    - "小助手"
    - "bot"


# ------------------------------------------------------------------
#  LLM（OpenAI 兼容端点：OpenAI / Ollama / vLLM / LM Studio / DeepSeek）
#  base_url 末尾不要加 /chat/completions
#  fallbacks 为备用端点列表：主端点失败/超时时按顺序自动切换。
#  每项含 base_url / model / api_key（跨服务商容灾）。
# ------------------------------------------------------------------
llm:
  base_url: "http://localhost:11434/v1"
  model: "llama2"
  api_key: ""
  max_tokens: 1000
  timeout: 30
  fallbacks:
    - base_url: "https://api.deepseek.com/v1"
      model: "deepseek-chat"
      api_key: ""
    # - base_url: "http://localhost:11434/v1"
    #   model: "llama3"
    #   api_key: ""


# ------------------------------------------------------------------
#  温度（Temperature）
#  注意：proactive_min 必须 <= proactive_max，否则启动报错。
# ------------------------------------------------------------------
temperature:
  default: 0.7
  proactive_min: 0.5
  proactive_max: 1.0


# ------------------------------------------------------------------
#  记忆系统（Memory）
#  注意：distillation_threshold 必须 < max_history。
# ------------------------------------------------------------------
memory:
  max_history: 50
  distillation_threshold: 40
  core_memory_max: 10


# ------------------------------------------------------------------
#  主动回复（Proactive）
#  同样经过休眠、黑白名单、频控等 Pipeline 检查。
# ------------------------------------------------------------------
proactive:
  enabled: true
  probability: 0.1
  cooldown: 300
  check_interval: 60


# ------------------------------------------------------------------
#  持久化（Persistence）
#  SQLite 存储聊天记录；摘要永久保留，原始消息按天数清理。
# ------------------------------------------------------------------
persistence:
  enabled: true
  db_path: "chat_history.db"
  retention_days: 7


# ------------------------------------------------------------------
#  Pipeline（消息处理流水线）
#  顺序：休眠 → 去重 → 黑白名单 → 静默 → 频控 → 管理命令
#       → 防抖 → 触发检测 → AI 派发 → 格式化 → 发送
#  任一阶段决定 drop，后续不再执行。
# ------------------------------------------------------------------
pipeline:

  # ── 休眠（Sleep） ───────────────────────────────────────────
  #  mode: "schedule"（定时）/ "manual"（手动 /sleep /wake）
  sleep:
    enabled: false
    mode: "schedule"
    schedule:
      start: "23:00"
      end: "08:00"
    override_by_mention: true

  # ── 去重（Dedup） ───────────────────────────────────────────
  dedup:
    enabled: true
    window: 5

  # ── 黑白名单（Access） ──────────────────────────────────────
  #  两名单独立、可同时启用；黑名单命中优先拦截，
  #  白名单启用后仅名单内用户/群可访问。
  access:
    whitelist:
      enabled: false
      users: []
      groups: []
    blacklist:
      enabled: false
      users: []
      groups: []

  # ── 静默关键词（Silent） ────────────────────────────────────
  silent:
    enabled: true
    keywords:
      - "闭嘴"
      - "别回"
      - "silent"

  # ── 频控（Rate Limit） ──────────────────────────────────────
  ratelimit:
    enabled: true
    max_requests: 3
    window: 10

  # ── 触发检测（Trigger） ─────────────────────────────────────
  #  mode: "mention"（@机器人）/ "keyword" / "spectator"（全部）
  trigger:
    mode: "keyword"
    keywords:
      - "小助手"
      - "bot"

  # ── 管理命令（Admin） ───────────────────────────────────────
  #  内置：清空记忆/状态/测试模型/休眠/唤醒（不经 LLM，即时响应）
  admin:
    enabled: true

  # ── 防抖合并（Debounce） ────────────────────────────────────
  debounce:
    enabled: true
    window: 3

  # ── 消息格式化（Format） ────────────────────────────────────
  #  mode: "plain" / "markdown"（基础 Markdown → CQ 码）
  format:
    max_length: 500
    mode: "plain"
